version: '3.8'

services:
  web:
    image: eduardohernandezmaqueda/agendatecex:latest
    ports:
      - "8022:5000" # Cambia a "8020:5000" si el puerto 5000 ya lo ocupa otro compañero
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:admin1234@db:5432/agendatec_db
    depends_on:
      - db
    networks:
      - red_eduardo
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=agendatec_db
    volumes:
      - pgdata_eduardo:/var/lib/postgresql/data
    networks:
      - red_eduardo
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker

volumes:
  pgdata_eduardo:

networks:
  red_eduardo:
    driver: overlay